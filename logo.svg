<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Pin logo</title>
  <desc id="desc">A square logo for Pin using a stylized letter P.</desc>
  <defs>
    <mask id="letter-p" maskUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="#000"/>
      <rect x="246" y="179" width="147" height="666" rx="63" fill="#fff"/>
      <rect x="308" y="179" width="471" height="471" rx="235.5" fill="#fff"/>
      <rect x="393" y="305" width="241" height="221" rx="110.5" fill="#000"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="#465FFF" style="fill: oklch(56.8% .237 270)"/>
  <rect width="1024" height="1024" fill="#F7FAFC" mask="url(#letter-p)"/>
</svg>
